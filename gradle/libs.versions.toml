# Catalogue unique des versions (PS-2). Toute nouvelle entrée est justifiée dans docs/architecture.md.
[versions]
agp = "9.5.0"
kotlin = "2.4.21"
junit4 = "4.13.2"
junitBom = "6.1.3"
ksp = "2.3.13"
hilt = "2.60.1"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"
androidxHilt = "1.4.0"
navigation = "2.10.2"
kotlinxSerialization = "1.12.0"
composeBom = "2026.09.00"
robolectric = "4.17"
# Jar Android (API 34) que Robolectric 4.17 charge ; le suffixe -iN suit la version de Robolectric.
robolectric-androidAll = "14-robolectric-10818077-i7"
# Jar Android 10 (API 29, notre minSdk) : tests des chemins propres aux anciennes versions (PS-181).
robolectric-androidAll-q = "10-robolectric-5803371-i7"
ktlintGradle = "14.2.0"
ktlint = "1.8.0"
detekt = "1.23.8"
konsist = "0.18.1"
kotlinxCoroutines = "1.11.0"
room = "2.8.5"
datastore = "1.3.0"
work = "2.12.0"
material3Adaptive = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
coil = "3.6.3"
media3 = "1.11.1"
glance = "1.2.0"

[libraries]
# AndroidX
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "androidxHilt" }
androidx-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "androidxHilt" }
androidx-hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerialization" }

# Jetpack Compose : versions alignées par la BOM, d'où l'absence de version.ref
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "material3Adaptive" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }

# Persistance locale des décisions (SPEC §6)
work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

# Préférences utilisateur (SPEC §5.3)
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# Chargement des images (SPEC §7) : coil-compose-core, sans le singleton global de coil-compose (ADR 0016)
coil-compose-core = { module = "io.coil-kt.coil3:coil-compose-core", version.ref = "coil" }
# Miniatures des vidéos : décodage d'une image de la vidéo par Coil (PS-50)
coil-video = { module = "io.coil-kt.coil3:coil-video", version.ref = "coil" }

# Lecture des vidéos (SPEC §7) : un seul ExoPlayer, affiché par les composants Compose de Media3
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui-compose = { module = "androidx.media3:media3-ui-compose", version.ref = "media3" }

# Widget « Ce jour-là » de l'écran d'accueil (PS-170) : Jetpack Glance, en Compose, et ses couleurs Material 3
glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "glance" }
glance-appwidget-testing = { module = "androidx.glance:glance-appwidget-testing", version.ref = "glance" }

# Injection de dépendances
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }

# Tests
junit4 = { module = "junit:junit", version.ref = "junit4" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junitBom" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
robolectric-androidAll = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectric-androidAll" }
robolectric-androidAll-q = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectric-androidAll-q" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# Plugins Gradle utilisés par build-logic
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
hilt-gradlePlugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }
room-gradlePlugin = { module = "androidx.room:room-gradle-plugin", version.ref = "room" }
ktlint-gradlePlugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlintGradle" }
detekt-gradlePlugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room", version.ref = "room" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }

# Plugins de convention (build-logic), sans version car fournis par le build inclus
photoswipe-android-application = { id = "photoswipe.android.application" }
photoswipe-android-library = { id = "photoswipe.android.library" }
photoswipe-jvm-library = { id = "photoswipe.jvm.library" }
photoswipe-android-hilt = { id = "photoswipe.android.hilt" }
photoswipe-android-compose = { id = "photoswipe.android.compose" }
photoswipe-android-room = { id = "photoswipe.android.room" }
photoswipe-android-robolectric = { id = "photoswipe.android.robolectric" }
photoswipe-quality = { id = "photoswipe.quality" }
