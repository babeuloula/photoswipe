<!doctype html>
<!-- Miniature des vidéos YouTube (1280 × 720). Rendu : voir docs/store/README.md, « Miniature YouTube ». -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Atkinson; src: url(../../../app/src/main/res/font/atkinson_hyperlegible_next.ttf); font-weight: 200 800; }
@font-face { font-family: PlexMono; src: url(../../../app/src/main/res/font/ibm_plex_mono_medium.ttf); }
* { margin: 0; box-sizing: border-box; }
html, body { width: 1280px; height: 720px; overflow: hidden; }
body { background: linear-gradient(160deg, #F5E3BE 0%, #EDD29A 55%, #E2BC72 100%); font-family: Atkinson; color: #2A1E08; position: relative; }
.text { position: absolute; left: 72px; top: 0; bottom: 0; width: 620px; display: flex; flex-direction: column; justify-content: center; }
.brand { display: flex; align-items: center; gap: 20px; margin-bottom: 36px; }
.brand img { width: 88px; height: 88px; border-radius: 22px; }
.brand span { font-size: 48px; font-weight: 700; }
h1 { font-size: 76px; line-height: 1.04; font-weight: 700; letter-spacing: -1px; text-wrap: balance; }
.chip { align-self: flex-start; margin-top: 36px; background: #2A1E08; color: #F2C96B; font-family: PlexMono; font-size: 28px; padding: 12px 24px; border-radius: 12px; clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%); }
.phone { position: absolute; width: 330px; height: 733px; border: 13px solid #231A0E; border-radius: 50px; background: #231A0E; overflow: hidden; box-shadow: 0 28px 60px rgba(60, 40, 5, .38); }
.phone img { width: 100%; display: block; border-radius: 37px; }
.back { left: 930px; top: 70px; transform: rotate(8deg); }
.front { left: 730px; top: 40px; transform: rotate(-5deg); }
</style></head>
<body>
<div class="text">
  <div class="brand"><img src="../../../fastlane/metadata/android/en-US/images/icon.png" alt=""><span>PhotoSwipe</span></div>
  <h1 id="title"></h1>
  <div class="chip" id="chip"></div>
</div>
<div class="phone back"><img id="back" alt=""></div>
<div class="phone front"><img id="front" alt=""></div>
<script>
const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'fr';
const t = {
  fr: { title: 'Vos souvenirs du jour, triés d’un geste', chip: 'Il y a 3 ans · 6 nov.' },
  en: { title: 'Today’s memories, sorted with a swipe', chip: '3 years ago · Nov 6' },
}[lang];
document.documentElement.lang = lang;
document.getElementById('title').textContent = t.title;
document.getElementById('chip').textContent = t.chip;
document.getElementById('front').src = `../screenshots/raw/${lang}/${lang}-2-keep.jpg`;
document.getElementById('back').src = `../screenshots/raw/${lang}/${lang}-3-delete.jpg`;
</script>
</body></html>
