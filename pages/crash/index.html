<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src https://glitchtip.babeuloula.fr; base-uri 'none'; form-action 'none'"
    />
    <meta name="theme-color" content="#FFF8F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15130F" media="(prefers-color-scheme: dark)" />
    <title>PhotoSwipe</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="page.js"></script>
  </head>
  <body>
    <main>
      <p class="film-edge"><img src="icon.svg" alt="" width="20" height="20" /> PhotoSwipe</p>

      <section id="report" hidden>
        <h1 data-text="title"></h1>
        <p class="lead" data-text="lead"></p>

        <div class="card">
          <dl id="summary"></dl>
          <p class="note" data-text="contains"></p>
          <details>
            <summary data-text="details"></summary>
            <pre id="raw" class="mono"></pre>
          </details>
        </div>

        <p id="failed" class="failed" role="alert" hidden></p>

        <div class="actions">
          <button id="send" class="primary" type="button" data-text="send"></button>
          <button id="skip" class="text" type="button" data-text="skip"></button>
        </div>

        <p class="note" data-text="recipient"></p>
      </section>

      <section id="state" hidden>
        <h1 id="state-title" tabindex="-1"></h1>
        <p id="state-text" class="lead"></p>
      </section>

      <footer>
        <a href="https://github.com/babeuloula/photoswipe/blob/main/PRIVACY.md" data-text="privacy"></a>
        <a href="https://github.com/babeuloula/photoswipe/tree/main/pages/crash" data-text="source"></a>
      </footer>
    </main>
  </body>
</html>
