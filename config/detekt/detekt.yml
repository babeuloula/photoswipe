# Configuration detekt (PS-5). Elle complète la configuration par défaut
# (`buildUponDefaultConfig = true`) : seuls les écarts sont listés ici, chacun justifié.

config:
  # Une règle inconnue ou une option mal orthographiée fait échouer detekt.
  validation: true

build:
  # Bloquant : le moindre problème fait échouer la tâche.
  maxIssues: 0

naming:
  FunctionNaming:
    # Les fonctions @Composable s'écrivent en PascalCase (convention Compose).
    ignoreAnnotated: ['Composable']

style:
  UnusedPrivateMember:
    # Les aperçus (@Preview, @PreviewLightDark) sont privés et appelés uniquement par l'IDE.
    ignoreAnnotated: ['Preview', 'PreviewLightDark']
  MagicNumber:
    # Les tests, leurs fixtures et les palettes de couleurs (Color(0xFF...)) sont faits de littéraux.
    excludes: ['**/test/**', '**/testFixtures/**', '**/ui/theme/**']
  # Le formatage relève de ktlint : la règle detekt ferait doublon.
  MaxLineLength:
    active: false

complexity:
  LongParameterList:
    # Les builders de test (aMediaItem(), aReviewEntry()…) ont un paramètre par propriété du modèle,
    # tous avec une valeur par défaut : c'est leur raison d'être.
    excludes: ['**/test/**', '**/testFixtures/**']
    # Les composables exposent, à la manière de Compose, des paramètres optionnels avec valeur par
    # défaut (modifier, rappels, états d'animation) : seuls les paramètres obligatoires comptent.
    ignoreDefaultParameters: true
  TooManyFunctions:
    # Une implémentation de port (dépôt Room, fake de test) reprend toutes les méthodes de son
    # interface : c'est le port qui en fixe le nombre, pas la classe.
    ignoreOverridden: true

# KDoc en français sur toute l'API publique (SPEC §12), vérifiée depuis PS-71. Les tests ne sont pas
# concernés. Exceptions : les fonctions des modules Hilt (`di`), décrites par la KDoc de leur
# module, et les `companion object`, dont les membres publics restent documentés un à un.
comments:
  UndocumentedPublicClass:
    active: true
    searchInInnerObject: false
    excludes: ['**/test/**', '**/testDebug/**', '**/testRelease/**', '**/androidTest/**']
  UndocumentedPublicFunction:
    active: true
    excludes: ['**/test/**', '**/testDebug/**', '**/testRelease/**', '**/androidTest/**', '**/di/**']
  UndocumentedPublicProperty:
    active: true
    excludes: ['**/test/**', '**/testDebug/**', '**/testRelease/**', '**/androidTest/**']
