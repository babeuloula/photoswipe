# Release (PS-115) : pousser un tag vX.Y.Z construit l'application signée et la joint à la version
# GitHub du tag. versionName vient du tag (AppVersion de build-logic), versionCode du nombre de
# commits : le checkout récupère donc tout l'historique et les tags.
#
# Secrets du dépôt (Settings → Secrets and variables → Actions), jamais dans le dépôt ni les journaux :
#   PHOTOSWIPE_UPLOAD_KEYSTORE_BASE64   clé d'upload (~/.android/photoswipe-upload.jks) encodée en base64
#   PHOTOSWIPE_UPLOAD_KEYSTORE_PASSWORD mot de passe du magasin de clés
#   PHOTOSWIPE_UPLOAD_KEY_PASSWORD      mot de passe de la clé (alias « upload »)
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Signed release build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Lecture seule : le cache n'est écrit que par les runs de main (ci.yml).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Clé d'upload écrite dans le dossier temporaire du runner, hors du dépôt, et keystore.properties
      # qui la désigne (lu par app/build.gradle.kts). Sans secret, la release s'arrête : pas de build non signé.
      - name: Restore the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.PHOTOSWIPE_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PHOTOSWIPE_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PHOTOSWIPE_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Upload key secrets are missing (see the header of release.yml)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Unit tests, quality and signed release build
        run: ./gradlew test quality bundleRelease assembleRelease --continue --console=plain

      # Vérifie la signature des deux fichiers avant de les publier.
      - name: Check signatures
        run: |
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME"/build-tools/"$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"/apksigner verify \
            app/build/outputs/apk/release/app-release.apk

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab "dist/photoswipe-$TAG.aab"
          cp app/build/outputs/apk/release/app-release.apk "dist/photoswipe-$TAG.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "PhotoSwipe ${TAG#v}" --generate-notes --verify-tag
          fi

      - name: Remove the upload key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/upload.jks" keystore.properties
