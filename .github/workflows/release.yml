# Releases (PS-115, PS-128, PS-130, PS-133, ADR 0032).
#
# Release officielle : lancer ce workflow à la main (Actions → Release → Run workflow) depuis main,
# avec la version vX.Y.Z. Il ne part que si le run « CI » de ce commit de main est terminé et vert :
# tests et qualité n'y sont donc pas relancés. Il crée la branche release/vX.Y.Z, y commite les
# notes de version F-Droid (scripts/fdroid-changelog.sh), construit l'AAB et l'APK signés par la clé
# d'upload, pose le tag vX.Y.Z sur ce commit et crée la release GitHub (notes générées, AAB, APK,
# version.properties pour F-Droid). Si une étape échoue, rien n'est tagué ni publié. Il envoie ensuite
# l'AAB sur la piste Play Store choisie (play_track, test interne par défaut, PS-152, ADR 0041) ; un
# échec de cet envoi laisse le tag et la release GitHub, avec un avertissement. Enfin, il ouvre
# la PR vers main avec le jeton PHOTOSWIPE_RELEASE_TOKEN : la vraie CI y tourne, et l'auto-merge la
# merge en merge commit (pour garder le commit tagué dans l'historique de main) une fois verte.
#
# Tag ou release créé à la main : seulement vX.Y.Z-dev.N. Build debug (outils développeur compris),
# APK seul joint à une pré-version, jamais « latest » : F-Droid ne la lit pas. Un tag d'une autre
# forme (v1.2.0, 1.2.0-dev.3…) est supprimé, avec sa release, et le workflow échoue : aucune release
# officielle à la main. Un tag posé sur un commit d'avant PS-130 lance l'ancien workflow de ce commit.
# Les tags poussés par ce workflow (jeton GITHUB_TOKEN) ne relancent pas d'événement push.
#
# versionName vient du tag (AppVersion de build-logic), versionCode du nombre de commits : le
# checkout récupère donc tout l'historique et les tags.
#
# Secrets du dépôt (Settings → Secrets and variables → Actions), jamais dans le dépôt ni les journaux :
#   PHOTOSWIPE_UPLOAD_KEYSTORE_BASE64   clé d'upload (~/.android/photoswipe-upload.jks) encodée en base64
#   PHOTOSWIPE_UPLOAD_KEYSTORE_PASSWORD mot de passe du magasin de clés
#   PHOTOSWIPE_UPLOAD_KEY_PASSWORD      mot de passe de la clé (alias « upload »)
#   PHOTOSWIPE_PLAY_SERVICE_ACCOUNT_JSON clé JSON du compte de service Google invité dans la Play
#                                       Console (docs/store/README.md) ; sans elle, rien n'est envoyé
#   PHOTOSWIPE_RELEASE_TOKEN            jeton personnel à grain fin (dépôt photoswipe seul : Contents et
#                                       Pull requests en écriture) : une PR ouverte par GITHUB_TOKEN ne
#                                       lance pas la CI. Sans lui, la PR est ouverte par le workflow,
#                                       sans auto-merge, et se merge à la main (contournement admin).
# Réglages du dépôt : « Allow auto-merge » (Settings → General) et, pour le cas sans jeton,
# « Allow GitHub Actions to create and approve pull requests » (Settings → Actions → General).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, par exemple v1.2.0"
        required: true
        type: string
      play_track:
        description: "Piste du Play Store : internal (test interne), alpha (test fermé), production, ou none pour ne rien envoyer"
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - production
          - none
  # Tous les tags, pour que le contrôle des tags poussés à la main voie aussi ceux sans « v ».
  push:
    tags: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Lecture des runs de la CI de main, pour la garde de la release.
  actions: read

jobs:
  release:
    name: Signed release build
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.version }}
      PLAY_TRACK: ${{ inputs.play_track }}
      # Lu dans les conditions des étapes : un secret ne peut pas y être lu directement.
      PLAY_CONFIGURED: ${{ secrets.PHOTOSWIPE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Check the version
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Run this workflow from main."
            exit 1
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like v1.2.0, got '$TAG'."
            exit 1
          fi

      # Tests et qualité ont déjà tourné sur ce commit dans la CI de main : on exige qu'elle soit verte
      # au lieu de les relancer (le commit de release n'ajoute qu'un fichier texte).
      - name: Check that the CI of main is green
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
            --commit "$GITHUB_SHA" --limit 1 --json status,conclusion,url \
            --jq '.[0] // empty | "\(.status) \(if (.conclusion // "") == "" then "none" else .conclusion end) \(.url)"')
          read -r status conclusion url <<<"${run:-none none none}"
          if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
            echo "::error::The CI of main ($GITHUB_SHA) must be green before a release (status: $status, conclusion: $conclusion, run: $url)."
            exit 1
          fi
          echo "CI of main is green: $url"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check that the version is new
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || git ls-remote --exit-code origin "refs/heads/release/$TAG" >/dev/null; then
            echo "::error::$TAG or release/$TAG already exists."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Lecture seule : le cache n'est écrit que par les runs de main (ci.yml).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Notes F-Droid tirées des notes que GitHub générera pour la release, dans le commit tagué.
      - name: Commit the F-Droid changelog on release/${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "release/$TAG"
          scripts/fdroid-changelog.sh "$TAG" main
          git add fastlane/metadata/android/en-US/changelogs/default.txt
          git commit --allow-empty -m "docs(release): F-Droid changelog for $TAG"

      # Clé d'upload écrite dans le dossier temporaire du runner, hors du dépôt, et keystore.properties
      # qui la désigne (lu par app/build.gradle.kts). Sans secret, la release s'arrête : pas de build non signé.
      - name: Restore the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.PHOTOSWIPE_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PHOTOSWIPE_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PHOTOSWIPE_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Upload key secrets are missing (see the header of release.yml)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      # Tag local d'abord : versionName (git describe) vaut alors X.Y.Z dans le build.
      - name: Tag the release commit
        run: git tag -a "$TAG" -m "PhotoSwipe ${TAG#v}"

      - name: Signed release build
        run: ./gradlew bundleRelease assembleRelease --console=plain

      # Vérifie la signature des deux fichiers avant de les publier.
      - name: Check signatures
        run: |
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME"/build-tools/"$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"/apksigner verify \
            app/build/outputs/apk/release/app-release.apk

      # Tout est publié à la fin, une fois le build vérifié : un échec plus tôt ne laisse rien.
      - name: Publish the branch, the pull request, the tag and the GitHub release
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab "dist/photoswipe-$TAG.aab"
          cp app/build/outputs/apk/release/app-release.apk "dist/photoswipe-$TAG.apk"
          # Numéros lus dans l'APK construit, pour la vérification des mises à jour de F-Droid.
          aapt2="$ANDROID_HOME"/build-tools/"$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"/aapt2
          badging=$("$aapt2" dump badging app/build/outputs/apk/release/app-release.apk | head -1)
          {
            echo "versionCode=$(echo "$badging" | sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p")"
            echo "versionName=$(echo "$badging" | sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p")"
          } > dist/version.properties
          cat dist/version.properties
          previous=$(git tag --list "v*" --sort=-v:refname | grep -v -- "-dev" | grep -vx "$TAG" | head -1)
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" dist/* --title "PhotoSwipe ${TAG#v}" --generate-notes \
            ${previous:+--notes-start-tag "$previous"} --verify-tag --latest

      # Envoi au Play Store (PS-152, ADR 0041), une fois la release GitHub publiée : un échec ne retire
      # ni le tag ni la release, l'AAB qui y est joint s'envoie alors à la main. Notes de version
      # reprises des notes F-Droid, en anglais et en français, 500 caractères au plus.
      - name: Prepare the Play Store notes
        id: play-notes
        if: ${{ env.PLAY_TRACK != 'none' && env.PLAY_CONFIGURED == 'true' }}
        continue-on-error: true
        run: python3 scripts/play_whatsnew.py fastlane/metadata/android/en-US/changelogs/default.txt dist/whatsnew

      - name: Upload to the Play Store
        id: play
        if: ${{ env.PLAY_TRACK != 'none' && env.PLAY_CONFIGURED == 'true' && steps.play-notes.outcome == 'success' }}
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PHOTOSWIPE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: fr.babeuloula.photoswipe
          releaseFiles: dist/photoswipe-${{ inputs.version }}.aab
          releaseName: ${{ inputs.version }}
          track: ${{ inputs.play_track }}
          status: completed
          whatsNewDirectory: dist/whatsnew
          # R8 est actif en release : plantages lisibles dans Android vitals.
          mappingFile: app/build/outputs/mapping/release/mapping.txt

      - name: Report the Play Store upload
        if: ${{ env.PLAY_TRACK != 'none' }}
        env:
          NOTES_OUTCOME: ${{ steps.play-notes.outcome }}
          UPLOAD_OUTCOME: ${{ steps.play.outcome }}
        run: |
          if [ "$PLAY_CONFIGURED" != "true" ]; then
            echo "::warning::PHOTOSWIPE_PLAY_SERVICE_ACCOUNT_JSON is missing: upload photoswipe-$TAG.aab to the Play Console by hand (see docs/store/README.md)."
          elif [ "$UPLOAD_OUTCOME" = "success" ]; then
            echo "Uploaded $TAG to the $PLAY_TRACK track of the Play Store."
          elif [ "$NOTES_OUTCOME" = "failure" ] || [ "$UPLOAD_OUTCOME" = "failure" ]; then
            echo "::warning::Upload to the $PLAY_TRACK track of the Play Store failed: the tag and the GitHub release stay; upload photoswipe-$TAG.aab from the release to the Play Console by hand."
          fi

      # La release est publiée : une PR impossible à ouvrir ne la fait pas échouer. Ouverte par le
      # jeton personnel, la PR lance la vraie CI et se merge seule (auto-merge, merge commit). Son
      # label « release » la retire des notes de la release suivante (.github/release.yml, PS-135).
      - name: Open the release pull request
        continue-on-error: true
        env:
          RELEASE_TOKEN: ${{ secrets.PHOTOSWIPE_RELEASE_TOKEN }}
        run: |
          git push origin "release/$TAG"
          body="Release $TAG : notes de version F-Droid. Le tag $TAG pointe sur le commit de cette PR. Merge en **merge commit** (pas de squash ni de rebase) pour garder ce commit dans l'historique de main."
          if [ -n "$RELEASE_TOKEN" ]; then
            url=$(GH_TOKEN="$RELEASE_TOKEN" gh pr create --base main --head "release/$TAG" \
              --title "chore(release): $TAG" --body "$body" --label release) \
              || { echo "::warning::Could not open the pull request: open release/$TAG → main by hand (merge commit)."; exit 1; }
            GH_TOKEN="$RELEASE_TOKEN" gh pr merge "$url" --auto --merge \
              || { echo "::warning::Could not enable auto-merge on $url: merge it by hand (merge commit) once green."; exit 1; }
            echo "Auto-merge enabled on $url"
          else
            echo "::warning::PHOTOSWIPE_RELEASE_TOKEN is missing: the pull request will not run the CI nor merge by itself (see release.yml)."
            gh pr create --base main --head "release/$TAG" --title "chore(release): $TAG" --body "$body" --label release \
              || { echo "::warning::Could not open the pull request: open release/$TAG → main by hand (merge commit)."; exit 1; }
          fi

      - name: Remove the upload key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/upload.jks" keystore.properties

  development:
    name: Development build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      # Une release officielle ne se crée que par le workflow : tout autre tag est retiré.
      - name: Refuse anything but a development tag
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]]; then
            exit 0
          fi
          echo "::error::Manual tags must look like vX.Y.Z-dev.N (for example v1.2.0-dev.3). Official releases go through Actions → Release → Run workflow. Removing $TAG."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          else
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG"
          fi
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Build debug : outils développeur compris, signé par la clé de debug partagée (PS-110).
      - name: Debug build
        run: ./gradlew assembleDebug --console=plain

      # Pré-version, jamais « latest » : la release lue par F-Droid reste la dernière officielle.
      - name: Publish the development APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/photoswipe-$TAG-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --prerelease --latest=false
          else
            gh release create "$TAG" dist/* --title "PhotoSwipe ${TAG#v} (debug)" --generate-notes \
              --verify-tag --prerelease --latest=false
          fi
