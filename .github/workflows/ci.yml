# CI : qualité (ktlint, detekt, Android Lint), tests unitaires et build debug à chaque push sur main et sur chaque PR.
# À faire évoluer avec le projet : chaque nouveau check y est ajouté.
# Deux jobs indépendants : le build JVM (obligatoire) et les tests instrumentés sur émulateur (PS-30).
# Les tests d'architecture Konsist (module :architecture-tests) tournent avec `test`.
# Le nom du job est un check obligatoire du ruleset de main (ADR 0004) : le renommer impose de mettre à jour le ruleset.
# Dépréciations (PS-132) : relevées dans le journal du build, en avertissements et en commentaire de PR, sans bloquer.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Quality, unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Écriture seulement pour le commentaire des dépréciations sur la PR (PS-132).
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Valide aussi le wrapper Gradle (protection contre un gradle-wrapper.jar altéré).
      # Cache Gradle (dépendances, build cache, wrapper) : écrit uniquement par les runs de main,
      # lu seul par les PR, pour qu'une branche ne pollue pas le cache des autres.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Scripts (seed de l'émulateur PS-70, notes F-Droid PS-129, rapport des dépréciations PS-132) :
      # tests Python (bibliothèque standard) et shellcheck, tous deux préinstallés sur le runner.
      - name: Script tests and shellcheck
        run: |
          python3 -m unittest discover -s scripts -v
          shellcheck scripts/*.sh

      # Page d'envoi des rapports de plantage (PS-134, ADR 0033) : tests JavaScript avec le
      # lanceur de tests de Node, préinstallé sur le runner.
      - name: Crash report page tests
        run: node --test pages/crash/*.test.mjs

      # Une seule invocation Gradle : avec org.gradle.parallel, Gradle répartit tests, qualité et build
      # entre les cœurs du runner et ne compile chaque module qu'une fois.
      # --continue : un échec n'arrête pas les tâches indépendantes, toutes les erreurs remontent d'un coup.
      # --warning-mode all et le script d'init (compilation Kotlin hors build cache) : toutes les
      # dépréciations apparaissent dans build.log, relu par l'étape suivante.
      - name: Unit tests, quality (ktlint, detekt, Android Lint) and debug build
        run: |
          set -o pipefail
          ./gradlew test quality assembleDebug --continue --console=plain --warning-mode all \
            --init-script .github/ci/kotlin-warnings.init.gradle.kts 2>&1 | tee build.log

      # Avertissements jaunes (lignes du code, run), résumé du job et commentaire unique sur la PR,
      # mis à jour à chaque push. Jamais bloquant : la CI reste verte (continue-on-error).
      - name: Deprecation report
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          python3 scripts/deprecation_report.py build.log --root "$GITHUB_WORKSPACE" --markdown deprecations.md
          cat deprecations.md >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$PR" ]; then
            exit 0
          fi
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- photoswipe-deprecations -->")) | .id' | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@deprecations.md >/dev/null
          elif grep -q "⚠️" deprecations.md; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@deprecations.md >/dev/null
          fi

      # Récapitulatif des tests JUnit dans le résumé du run, même en cas d'échec d'une étape.
      # annotate_only : annotations et résumé seulement, sans créer de check (aucune permission en écriture).
      - name: Test summary
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "**/build/test-results/**/TEST-*.xml"
          annotate_only: true
          require_tests: true
          detailed_summary: true
          include_passed: true

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  instrumented:
    name: Instrumented tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # L'émulateur actuel (API 34) garde son nom de check ; Android 10 (API 29, notre minSdk) vérifie
    # MediaStore sans favoris ni corbeille et la suppression directe (PS-186, ADR 0042).
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 34
            label: emulator
          - api-level: 29
            label: Android 10 emulator
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # L'émulateur réserve plus de 7 Go pour sa partition de données : on retire du runner des outils
      # inutiles ici (.NET, GHC, Boost, CodeQL, NDK Android) pour libérer la place.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk
          df -h /

      # L'émulateur x86_64 a besoin de l'accélération matérielle KVM, disponible sur les runners Linux.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Tests src/androidTest de tous les modules (MediaStore réel, migrations Room) sur un émulateur de la
      # matrice ; les tests propres à une version plus récente s'y ignorent (assumeTrue).
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --console=plain

      - name: Test summary
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "**/build/outputs/androidTest-results/connected/**/TEST-*.xml"
          annotate_only: true
          require_tests: true
          detailed_summary: true
          include_passed: true

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-reports-api-${{ matrix.api-level }}
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          retention-days: 7
