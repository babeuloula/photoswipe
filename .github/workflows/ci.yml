# CI : qualité (ktlint, detekt, Android Lint), tests unitaires et build debug à chaque push sur main et sur chaque PR.
# À faire évoluer avec le projet : chaque nouveau check (Konsist, tests instrumentés, ...) y est ajouté.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Quality, unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Valide aussi le wrapper Gradle (protection contre un gradle-wrapper.jar altéré).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests (modules + build-logic conventions)
        run: ./gradlew test --console=plain

      - name: Quality (ktlint, detekt, Android Lint)
        run: ./gradlew quality --console=plain

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
