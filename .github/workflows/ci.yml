# CI : qualité (ktlint, detekt, Android Lint), tests unitaires et build debug à chaque push sur main et sur chaque PR.
# À faire évoluer avec le projet : chaque nouveau check (tests instrumentés, ...) y est ajouté.
# Les tests d'architecture Konsist (module :architecture-tests) tournent avec `test`.
# Le nom du job est un check obligatoire du ruleset de main (ADR 0004) : le renommer impose de mettre à jour le ruleset.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Quality, unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Valide aussi le wrapper Gradle (protection contre un gradle-wrapper.jar altéré).
      # Cache Gradle (dépendances, build cache, wrapper) : écrit uniquement par les runs de main,
      # lu seul par les PR, pour qu'une branche ne pollue pas le cache des autres.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests (modules, Konsist architecture rules, build-logic conventions)
        run: ./gradlew test --console=plain

      - name: Quality (ktlint, detekt, Android Lint)
        run: ./gradlew quality --console=plain

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      # Récapitulatif des tests JUnit dans le résumé du run, même en cas d'échec d'une étape.
      # annotate_only : annotations et résumé seulement, sans créer de check (aucune permission en écriture).
      - name: Test summary
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "**/build/test-results/**/TEST-*.xml"
          annotate_only: true
          require_tests: true
          detailed_summary: true
          include_passed: true

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
