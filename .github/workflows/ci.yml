# CI : qualité (ktlint, detekt, Android Lint), tests unitaires et build debug à chaque push sur main et sur chaque PR.
# À faire évoluer avec le projet : chaque nouveau check y est ajouté.
# Deux jobs indépendants : le build JVM (obligatoire) et les tests instrumentés sur émulateur (PS-30).
# Les tests d'architecture Konsist (module :architecture-tests) tournent avec `test`.
# Le nom du job est un check obligatoire du ruleset de main (ADR 0004) : le renommer impose de mettre à jour le ruleset.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Quality, unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Valide aussi le wrapper Gradle (protection contre un gradle-wrapper.jar altéré).
      # Cache Gradle (dépendances, build cache, wrapper) : écrit uniquement par les runs de main,
      # lu seul par les PR, pour qu'une branche ne pollue pas le cache des autres.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Script de seed de l'émulateur (PS-70) : tests Python (bibliothèque standard) et shellcheck,
      # tous deux préinstallés sur le runner.
      - name: Seed script tests and shellcheck
        run: |
          python3 -m unittest discover -s scripts -v
          shellcheck scripts/*.sh

      # Une seule invocation Gradle : avec org.gradle.parallel, Gradle répartit tests, qualité et build
      # entre les cœurs du runner et ne compile chaque module qu'une fois.
      # --continue : un échec n'arrête pas les tâches indépendantes, toutes les erreurs remontent d'un coup.
      - name: Unit tests, quality (ktlint, detekt, Android Lint) and debug build
        run: ./gradlew test quality assembleDebug --continue --console=plain

      # Récapitulatif des tests JUnit dans le résumé du run, même en cas d'échec d'une étape.
      # annotate_only : annotations et résumé seulement, sans créer de check (aucune permission en écriture).
      - name: Test summary
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "**/build/test-results/**/TEST-*.xml"
          annotate_only: true
          require_tests: true
          detailed_summary: true
          include_passed: true

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # L'émulateur réserve plus de 7 Go pour sa partition de données : on retire du runner des outils
      # inutiles ici (.NET, GHC, Boost, CodeQL, NDK Android) pour libérer la place.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk
          df -h /

      # L'émulateur x86_64 a besoin de l'accélération matérielle KVM, disponible sur les runners Linux.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Tests src/androidTest de tous les modules (MediaStore réel, migrations Room) sur un émulateur API 34.
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --console=plain

      - name: Test summary
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "**/build/outputs/androidTest-results/connected/**/TEST-*.xml"
          annotate_only: true
          require_tests: true
          detailed_summary: true
          include_passed: true

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          retention-days: 7
