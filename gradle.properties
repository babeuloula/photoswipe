org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
# Exécute les tâches des modules indépendants en parallèle (local et CI).
org.gradle.parallel=true
org.gradle.configuration-cache=true
kotlin.code.style=official
# KSP incrémental perdait des fichiers générés (modules Hilt de src/debug, classes Hilt_* de la release)
# après un changement de branche ou une restauration depuis le cache : traitement complet à chaque fois.
ksp.incremental=false
